apiVersion: v1
kind: ConfigMap
metadata:
  name: web-portal-config
  namespace: enterprise-siem
data:
  nginx.conf: |
    # Nginx configuration would be included here
---
apiVersion: v1
kind: Service
metadata:
  name: web-portal
  namespace: enterprise-siem
  labels:
    app: web-portal
    tier: frontend
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: web-portal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-portal
  namespace: enterprise-siem
  labels:
    app: web-portal
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-portal
  template:
    metadata:
      labels:
        app: web-portal
        tier: frontend
    spec:
      containers:
        - name: web-portal
          image: enterprise-siem/web-portal:latest
          ports:
            - containerPort: 80
              name: http
          env:
            - name: VITE_API_URL
              value: "http://api-gateway:8080"
            - name: VITE_WS_URL
              value: "ws://collaboration-hub:8083"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-portal-hpa
  namespace: enterprise-siem
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-portal
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-portal-ingress
  namespace: enterprise-siem
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - siem.example.com
      secretName: web-portal-tls
  rules:
    - host: siem.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-portal
                port:
                  number: 80
