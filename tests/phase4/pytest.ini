[pytest]
# Pytest configuration for Phase 4 tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 3.9

# Test paths
testpaths = .

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes

# Markers
markers =
    phase4: Phase 4 enterprise features tests
    unit: Unit tests
    integration: Integration tests requiring external services
    performance: Performance and load tests
    slow: Tests that take longer to execute (>5 seconds)
    multi_tenant: Multi-tenancy specific tests
    compliance: Compliance framework tests
    security: Security-related tests
    smoke: Smoke tests for quick validation

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Test timeout (in seconds)
timeout = 300
timeout_method = thread

# Asyncio mode
asyncio_mode = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/phase4/test_results.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# xdist (parallel execution)
[pytest-xdist]
looponfail = False

# Environment variables for tests
[pytest-env]
TEST_ENV = true
MOCK_INTEGRATIONS = true
